<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title> practice website </title>
        <style>
        *   {
                margin:0;
                padding:0;
                box-sizing: border-box;
            }

            header{
                background-color: aqua;
                color: #000;
                padding: 15px;
                text-align: center;
            }

            nav{
                display: flex;
                background-color: aliceblue;
                padding: 15px;
                justify-content: space-around;
            }

            .main-container{
                background-color: beige;
                color: #000;
                padding: 15px;
                
            }

            nav a {
                color: black;
                text-decoration: none;
                font-weight: bold;
                transition: background 0.3s ease;
            }
            nav a:hover{
                color: blue;
            }
            .cards{
                display: flex;
                gap: 10px;
                margin-top: 10px;
                margin-bottom: 10px;
            }
            .card{
                flex: 1;
                width: 25px;
                height: 200px;
                background-color: aquamarine;
                padding: 10px;
                text-align: center;
                border-radius: 10px;
            }

            .error{
                color: red;
            }

            form {
                margin-top: 10px;
            }

            input, button {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
            }
            button:active {
                transform: scale(0.95);
            }
        </style>
    </head>
    <body>
        <header><h1>This is the Practice Website</h1></header>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contact Us</a>
        </nav>

        <div class="main-container">
            <aside>
                <h1>Side bar</h1>
                <p> click button to change </p>
                <button onclick="changeText()">Change Text</button>

            </aside>
            

           <section>
                <h2 id="ttl"> Welcome </h2>
                <div class="cards">
                    <div class="card">Card 1
                        <img src="path/to/image" alt="Description of the image">
                    </div>
                    <div class="card">Card 2
                        <img src="path/to/image" alt="Description of the image">
                    </div>
                    <div class="card">Card 3
                        <img src="path/to/image" alt="Description of the image">
                    </div>
                </div>
           </section>

           <form id="myForm">
            <input type="text" id="Name" placeholder="Enter your Name">
            <span class="error" id="nameError"></span>
                        
            <input type="text" id="Email" placeholder="Enter your Email">
            <span class="error" id="emailError"></span>

            <input type="password" id="Password" placeholder="Enter your Password">
            <span class="error" id="passError"></span>
            
            <button type="submit" style="
    transition: transform 0.2s ease, background 0.3s ease;">Submit</button>
           </form>

           <p id="message"></p>
        </div>


        <footer>
            <h2>this is the footer sectioon</h2>
        </footer>

        <script>
            function changeText(){
                let temp = document.getElementById("ttl").textContent;
                if(temp == "changed"){
                    document.getElementById("ttl").textContent = "Welcome";
                }else{
                    document.getElementById("ttl").textContent = "changed";
                }
            }

            document.getElementById("myForm").addEventListener("submit",function(e){
                e.preventDefault();

                let name = document.getElementById("Name").value;
                let email = document.getElementById("Email").value;                
                let password = document.getElementById("Password").value;


                let valid = true;

                document.getElementById("nameError").textContent = "";
                document.getElementById("emailError").textContent = "";
                document.getElementById("passError").textContent = "";
                
                if (name === "") {
                    document.getElementById("nameError").textContent = "Name required";
                    valid = false;
                }

                let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
                if (!pattern.test(email)) {
                    document.getElementById("emailError").textContent = "Invalid email";
                    valid = false;
                }

                if (password.length < 6) {
                    document.getElementById("passError").textContent = "Min 6 characters";
                    valid = false;
                }

                if (valid) {
                    document.getElementById("message").textContent = "✅ Form Submitted Successfully!";
                    document.getElementById("message").className = "success";
                }
            });
        </script>

    </body>
</html>
